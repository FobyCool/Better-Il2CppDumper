apply plugin: 'idea'

idea.module {
    excludeDirs += file('out')
    resourceDirs += file('template')
    resourceDirs += file('scripts')
}

buildscript {
    repositories {
        mavenCentral()
        google()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:7.4.2'
    }
}

allprojects {
    repositories {
        mavenCentral()
        google()
    }
}

ext {
    minSdkVersion = 23
    targetSdkVersion = 32

    outDir = file("$rootDir/out")
}

task packageZip(type: Zip) {
    destinationDirectory = outDir
    archiveFileName = "${rootProject.name ?: 'module'}.zip"

    // Include files from module/files at the root of the zip
    from("$rootDir/module/files") {
        include '**/*'
    }

    // Optional: include template and scripts if needed
    // from("$rootDir/template") { into 'template' }
    // from("$rootDir/scripts") { into 'scripts' }
}

task clean(type: Delete) {
    delete rootProject.buildDir, outDir
}
