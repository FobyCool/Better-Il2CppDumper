apply plugin: 'idea'

idea.module {
    excludeDirs += file('out')
    resourceDirs += file('template')
    resourceDirs += file('scripts')
}

buildscript {
    repositories {
        mavenCentral()
        google()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:7.4.2'
    }
}

allprojects {
    repositories {
        mavenCentral()
        google()
    }
}

ext {
    minSdkVersion = 23
    targetSdkVersion = 32

    outDir = file("$rootDir/out")
}

task clean(type: Delete) {
    delete rootProject.buildDir, outDir
}

// This hooks into your template's packaging step to inject your custom folder
tasks.withType(Zip).configureEach { task ->
    // Ensures we only modify the module packaging task, not random intermediate zips
    if (task.name.contains("zygisk-il2cppdumper")) {
        task.from(file("${projectDir}/module/files")) {
            into(".")
        }
    }
}
